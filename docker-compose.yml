version: '3.8'

services:
  # --------------------------
  # Redis
  # --------------------------
  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - app-net

  # --------------------------
  # RedisInsight
  # --------------------------
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "${REDISINSIGHT_PORT}:5540"
    depends_on:
      - redis
    networks:
      - app-net

  mysql:
    image: mysql:8.4
    container_name: mysql
    ports:
      - "${DB_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    networks:
      - app-net
volumes:
  redis_data:

networks:
  app-net:
    driver: bridge
